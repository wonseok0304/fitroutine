<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
  (function () {
    var saved = localStorage.getItem('fitroutine-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 루틴 추천 | 핏루틴</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">핏루틴<span class="logo-dot">.</span></a>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크모드 전환">🌙</button>
      <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
      <a href="index.html">메인</a>
      <a href="recommend.html" class="active">AI 추천</a>
      <a href="faq.html">FAQ</a>
      </nav>
    </div>
  </div>
</header>

<main class="recommend-page">
  <section class="page-intro">
    <p class="eyebrow">AI 루틴 추천</p>
    <h1>세 가지만 알려주세요</h1>
    <p class="hero-sub">관심사와 시간, 레벨을 입력하면 이번 주 루틴을 만들어 드려요.</p>
  </section>

  <section class="form-area">
    <form id="routineForm" novalidate>
      <div class="field">
        <label for="interest">관심사 / 운동 종류</label>
        <input type="text" id="interest" name="interest" placeholder="예: 러닝, 요가, 헬스, 클라이밍…" required>
      </div>

      <div class="field">
        <label for="time">하루에 낼 수 있는 시간</label>
        <select id="time" name="time" required>
          <option value="">선택해주세요</option>
          <option value="10~20분">10~20분</option>
          <option value="20~40분">20~40분</option>
          <option value="40~60분">40~60분</option>
          <option value="60분 이상">60분 이상</option>
        </select>
      </div>

      <div class="field">
        <label>현재 레벨</label>
        <div class="radio-row">
          <label class="radio-pill"><input type="radio" name="level" value="초급" checked><span>초급</span></label>
          <label class="radio-pill"><input type="radio" name="level" value="중급"><span>중급</span></label>
          <label class="radio-pill"><input type="radio" name="level" value="고급"><span>고급</span></label>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">루틴 만들기 →</button>
      <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="result-area" id="resultArea" hidden>
    <div class="ticket ticket-result" id="resultTicket">
      <div class="ticket-top">
        <span class="ticket-label">YOUR WEEKLY ROUTINE</span>
        <span class="ticket-no" id="resultNo">NO. --</span>
      </div>
      <div id="resultBody" class="result-body"></div>
      <div class="ticket-stub">
        <span id="resultLevel">LEVEL · -</span>
        <span id="resultTime">TIME · -</span>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>핏루틴 · 취미·운동 루틴 추천 서비스 (교육용 프로젝트)</p>
</footer>

<script src="js/nav.js"></script>
<script src="js/theme.js"></script>
<script src="js/recommend.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
